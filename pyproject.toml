[project]
name = "oop-in-python-from-terror-to-understanding"
version = "0.1.0"
description = "Учебные мини-игры с курса «ООП на Python: от ужаса до понимания» (Stepik)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ibndaud" },
]
requires-python = ">=3.13"
dependencies = [
    "pgzero>=1.2.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E4/E7/E9 — pycodestyle (ошибки и стиль), F — pyflakes (реальные баги).
# Базовый уровень для учебного проекта; расширяется по желанию.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Pygame Zero внедряет имена screen, mouse, keys на этапе выполнения —
# статический анализатор их не видит, это ложные срабатывания.
"circles_game/main.py" = ["F821"]
"circles_game/tyk_tyk.py" = ["F821"]